<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peel Sticker Button</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; align-content: center; gap: 48px;
    background: #1e1e1e; font-family: "Space Grotesk", system-ui, sans-serif;
  }

  .sticker {
    --h: 106px;
    --s: calc(var(--h) / 512);
    --edge: max(calc(10 * var(--s)), 2px);
    --ease: cubic-bezier(.2, .9, .25, 1);

    position: relative; display: block; overflow: hidden;
    height: var(--h); width: calc(1555 * var(--s));
    padding: 0; border: 0; cursor: pointer; background: none;
    font: inherit;                  /* <button> defaults to Arial otherwise */
    border-radius: calc(122 * var(--s));
    isolation: isolate;
    -webkit-tap-highlight-color: transparent;
    transition: transform .35s var(--ease);
  }
  .sticker:active { transform: scale(.965); transition-duration: .12s; }
  .sticker:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

  .face { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .face .edge {
    fill: none; stroke: #fff;
    vector-effect: non-scaling-stroke;
    stroke-width: calc(2 * var(--edge));
  }

  .label {
    position: absolute; inset: 0; display: grid; place-items: center;
    white-space: nowrap; pointer-events: none;
    font-size: calc(270 * var(--s));
    letter-spacing: calc(-16.2 * var(--s));
  }
  .label {
    color: #fff; font-weight: 700;
    text-shadow: 0 calc(4 * var(--s)) calc(20 * var(--s)) rgba(0,0,0,.25);
  }

  .peel {
    position: absolute; left: 0; bottom: 0; z-index: 1;
    width: calc(337 * var(--s)); height: calc(299 * var(--s));
    overflow: visible; pointer-events: none;
    transform-origin: 0 100%;
    transform: scale(0);
    transition: transform .3s var(--ease);
  }
  .sticker:hover .peel,
  .sticker:focus-visible .peel {
    transform: scale(1);
    transition: transform .32s cubic-bezier(.34, 1.4, .5, 1);
  }
  .sticker.is-peeled .peel {
    transform: translate(calc(700 * var(--s)), calc(-700 * var(--s))) scale(2.5);
    transition: transform .55s cubic-bezier(.45, 0, .15, 1);
  }

  @media (prefers-reduced-motion: reduce) {
    .peel, .sticker { transition: none; }
  }
</style>
</head>
<body>

<button class="sticker" type="button" aria-pressed="false">
  <svg class="face" viewBox="0 0 1555 512" aria-hidden="true">
    <defs>
      <linearGradient id="red" gradientUnits="userSpaceOnUse" x1="1509.39" y1="0" x2="1255.6" y2="853.82">
        <stop stop-color="#EE4A50"/>
        <stop offset=".5" stop-color="#DA1F26"/>
        <stop offset="1" stop-color="#8D282C"/>
      </linearGradient>
      <pattern id="stripes" patternUnits="userSpaceOnUse" width="63" height="45" patternTransform="rotate(41.2921)">
        <rect width="63" height="22.5" fill="#fff"/>
      </pattern>
      <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="-12.992" y1="10.9956" x2="276.735" y2="876.717">
        <stop stop-color="#fff"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <mask id="fade-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1555" height="512">
        <rect width="1555" height="512" rx="122" fill="url(#fade)"/>
      </mask>
      <clipPath id="outer"><rect width="1555" height="512" rx="122"/></clipPath>
    </defs>
    <rect width="1555" height="512" rx="122" fill="url(#red)"/>
    <g clip-path="url(#outer)" mask="url(#fade-mask)">
      <rect x="-400" y="-400" width="2400" height="1400" fill="url(#stripes)" fill-opacity=".15"/>
    </g>
    <rect class="edge" width="1555" height="512" rx="122"/>
  </svg>

  <span class="label">Submit</span>

  <svg class="peel" viewBox="0 0 337 299" aria-hidden="true">
    <defs>
      <linearGradient id="curl" gradientUnits="userSpaceOnUse" x1="229.297" y1="89.424" x2="150.918" y2="180.578">
        <stop stop-color="#fff"/>
        <stop offset=".759615" stop-color="#C6D1D8"/>
        <stop offset="1" stop-color="#C6D1D7"/>
      </linearGradient>
      <linearGradient id="roll" gradientUnits="userSpaceOnUse" x1="49" y1="-50" x2="0" y2="0">
        <stop stop-color="#fff"/>
        <stop offset=".76" stop-color="#C6D1D8"/>
        <stop offset="1" stop-color="#C6D1D7"/>
      </linearGradient>
      <filter id="curl-shadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
        <feDropShadow in="SourceGraphic" dx="0"   dy="6"  stdDeviation="15" flood-opacity=".25" result="figma"/>
        <feDropShadow in="SourceGraphic" dx="-6"  dy="8"  stdDeviation="16" flood-opacity=".12" result="cast"/>
        <feDropShadow in="SourceGraphic" dx="-1"  dy="2"  stdDeviation="2"  flood-opacity=".18" result="contact"/>
        <feMerge>
          <feMergeNode in="cast"/><feMergeNode in="figma"/><feMergeNode in="contact"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <linearGradient id="ao" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-42" y2="43">
        <stop stop-color="#000" stop-opacity=".09"/>
        <stop offset="1" stop-color="#000" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path fill="#fff" d="M-2856 -2800 L0 0 L35.8824 47.38 L92.9261 116.38 L226.335 243.34 L247.956 256.68 L286.599 285.66 L305 299 L3305 3240 L3305 9000 L-9000 9000 L-9000 -2800 Z"/>
    <path fill="url(#ao)" d="M-2856 -2800 L0 0 L35.8824 47.38 L92.9261 116.38 L226.335 243.34 L247.956 256.68 L286.599 285.66 L305 299 L3305 3240 L3263 3283 L263 342 L-2898 -2757 Z"/>
    <g filter="url(#curl-shadow)">
      <path fill="url(#roll)" d="M0 0 L-36.7 -134 L-2807 -2850 L-2856 -2800 Z"/>
      <path fill="url(#curl)" transform="translate(-30 0)"
        d="M265.428 221.947C243.858 181.804 260.135 131.371 226.535 95.417C192.936 59.4625 150.304 90.078 111.928 71.4472C73.5521 52.8159 30 0 30 0C30 0 80.3993 95.478 162.16 177.239C243.922 259 337 301 337 301C337 301 286.998 262.09 265.428 221.947Z"/>
    </g>
  </svg>
</button>

<button class="sticker" type="button" aria-pressed="false" style="--h: 64px">
  <svg class="face" viewBox="0 0 1555 512" aria-hidden="true">
    <rect width="1555" height="512" rx="122" fill="url(#red)"/>
    <g clip-path="url(#outer)" mask="url(#fade-mask)">
      <rect x="-400" y="-400" width="2400" height="1400" fill="url(#stripes)" fill-opacity=".15"/>
    </g>
    <rect class="edge" width="1555" height="512" rx="122"/>
  </svg>
  <span class="label">Continue</span>
  <svg class="peel" viewBox="0 0 337 299" aria-hidden="true">
    <path fill="#fff" d="M-2856 -2800 L0 0 L35.8824 47.38 L92.9261 116.38 L226.335 243.34 L247.956 256.68 L286.599 285.66 L305 299 L3305 3240 L3305 9000 L-9000 9000 L-9000 -2800 Z"/>
    <path fill="url(#ao)" d="M-2856 -2800 L0 0 L35.8824 47.38 L92.9261 116.38 L226.335 243.34 L247.956 256.68 L286.599 285.66 L305 299 L3305 3240 L3263 3283 L263 342 L-2898 -2757 Z"/>
    <g filter="url(#curl-shadow)">
      <path fill="url(#roll)" d="M0 0 L-36.7 -134 L-2807 -2850 L-2856 -2800 Z"/>
      <path fill="url(#curl)" transform="translate(-30 0)"
        d="M265.428 221.947C243.858 181.804 260.135 131.371 226.535 95.417C192.936 59.4625 150.304 90.078 111.928 71.4472C73.5521 52.8159 30 0 30 0C30 0 80.3993 95.478 162.16 177.239C243.922 259 337 301 337 301C337 301 286.998 262.09 265.428 221.947Z"/>
    </g>
  </svg>
</button>

<script>
  for (const b of document.querySelectorAll('.sticker')) {
    b.addEventListener('click', () => {
      const on = b.classList.toggle('is-peeled');
      b.setAttribute('aria-pressed', on);
    });
  }
</script>
</body>
</html>
